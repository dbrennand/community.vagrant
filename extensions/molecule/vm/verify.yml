---
- name: Verify the created VM
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Check that the generated Vagrantfile exists
      ansible.builtin.stat:
        path: "{{ molecule_vm_workdir }}/Vagrantfile"
      register: vagrantfile_stat

    - name: Assert the Vagrantfile was created
      ansible.builtin.assert:
        that:
          - vagrantfile_stat.stat.exists
          - vagrantfile_stat.stat.isreg

    - name: Read the generated Vagrantfile
      ansible.builtin.slurp:
        src: "{{ molecule_vm_workdir }}/Vagrantfile"
      register: vagrantfile_content

    - name: Assert the configured box is present in the Vagrantfile
      ansible.builtin.assert:
        that:
          - molecule_vm_box in (vagrantfile_content.content | b64decode)

    - name: Query Vagrant machine status
      ansible.builtin.command: vagrant status --machine-readable
      args:
        chdir: "{{ molecule_vm_workdir }}"
      register: vagrant_status
      changed_when: false

    - name: Assert Vagrant reports the VM as running
      ansible.builtin.assert:
        that:
          - "',state,running' in vagrant_status.stdout"

    - name: Predict the started state in check mode
      community.vagrant.vm:
        state: started
        name: "{{ molecule_vm_name }}"
        workdir: "{{ molecule_vm_workdir }}"
        box: "{{ molecule_vm_box }}"
      check_mode: true
      register: vm_check_started

    - name: Assert check mode reports the effective started state
      ansible.builtin.assert:
        that:
          - not vm_check_started.changed
          - vm_check_started.state == "running"
          - vm_check_started.status.state == "running"
          - vm_check_started.ssh is defined

    - name: Predict the absent state in check mode
      community.vagrant.vm:
        state: absent
        name: "{{ molecule_vm_name }}"
        workdir: "{{ molecule_vm_workdir }}"
        cleanup_workdir: false
      check_mode: true
      register: vm_check_absent

    - name: Assert check mode reports the effective absent state
      ansible.builtin.assert:
        that:
          - vm_check_absent.changed
          - vm_check_absent.state == "not_created"
          - vm_check_absent.status.state == "running"
